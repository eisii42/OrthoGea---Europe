name: Verify catalogued endpoints

on:
  schedule:
    # Mondays at 04:17 UTC. Off the hour on purpose: every scheduled workflow
    # on GitHub fires at :00, and the queue there is the main cause of a run
    # starting half an hour late.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: live endpoint check
    runs-on: ubuntu-latest
    # National services are occasionally slow rather than down, and the script
    # probes every record twice - GetCapabilities plus a real tile.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # `--json` takes a path, and `--strict` exits non-zero when an *active*
      # record fails. `continue-on-error` so the report is still read and
      # turned into an issue when something is down.
      - name: Probe every catalogued endpoint
        id: probe
        continue-on-error: true
        working-directory: packages/catalog
        run: node scripts/verify-endpoints.mjs --strict --json endpoint-report.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-report
          path: packages/catalog/endpoint-report.json
          if-no-files-found: warn

      - name: Summarise the failures
        if: steps.probe.outcome == 'failure'
        id: summary
        working-directory: packages/catalog
        run: node scripts/endpoint-issue-body.mjs endpoint-report.json --github-output

      # One open issue is kept up to date rather than a new one every Monday:
      # a stale endpoint usually stays stale for weeks, and a fresh issue per
      # run buries the rest of the tracker.
      - name: Open or update the issue
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          REPORT_BODY: ${{ steps.summary.outputs.body }}
          FAIL_COUNT: ${{ steps.summary.outputs.count }}
        with:
          script: |
            const title = "Catalogued endpoints are failing the weekly probe";
            const body = `${process.env.REPORT_BODY}\n\n<sub>Opened by \`${context.workflow}\`, run ${context.runId}.</sub>`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "endpoint-health"
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.notice(`Updated issue #${existing.number} (${process.env.FAIL_COUNT} failing).`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["endpoint-health"]
              });
              core.notice(`Opened issue #${created.number} (${process.env.FAIL_COUNT} failing).`);
            }

      - name: Close the issue when everything answers again
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Catalogued endpoints are failing the weekly probe";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "endpoint-health"
            });
            for (const issue of open.filter((candidate) => candidate.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Every catalogued endpoint answered as recorded on run ${context.runId}. Closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
            }
